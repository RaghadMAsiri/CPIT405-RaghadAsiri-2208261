<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 - JavaScript Events & Cookies</title>
    <style>
        /* --- Design matches the attached lab image --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            font-family: "Times New Roman", Times, serif;
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Voting buttons styling */
        .voting-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .vote-btn {
            font-size: 36px;
            padding: 10px 30px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f1f1f1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .vote-btn:hover:not(:disabled) {
            background-color: #e2e2e2;
            transform: scale(1.05);
            /* Simple animation (optional requirement) */
        }

        .vote-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .vote-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Comments section styling */
        .comments-section {
            text-align: left;
        }

        .comments-section h2 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 15px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-buttons button {
            background-color: #555555;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-buttons button:hover {
            background-color: #333333;
        }

        /* Display area for added comment */
        #displayCommentArea {
            background-color: #f9f9f9;
            border-left: 4px solid #555;
            padding: 15px;
            margin-top: 20px;
            display: none;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Lab 6</h1>
        <h2>Like or dislike</h2>

        <div class="voting-section">
            <button id="likeBtn" class="vote-btn">👍 <span id="likeCount">100</span></button>
            <button id="dislikeBtn" class="vote-btn">👎 <span id="dislikeCount">20</span></button>
        </div>

        <h2>Comments</h2>

        <div class="comments-section">
            <textarea id="commentInput" placeholder="Write a comment..."></textarea>

            <div class="action-buttons">
                <button id="submitBtn">Submit</button>
                <button id="clearBtn">Clear</button>
            </div>

            <div id="displayCommentArea">
                <strong>Your Comment:</strong> <span id="userCommentText"></span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Basic Variables Setup ---
        let likes = 100;
        let dislikes = 20;

        // Get DOM Elements
        const likeBtn = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        const likeCountSpan = document.getElementById('likeCount');
        const dislikeCountSpan = document.getElementById('dislikeCount');

        const commentInput = document.getElementById('commentInput');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const displayCommentArea = document.getElementById('displayCommentArea');
        const userCommentText = document.getElementById('userCommentText');

        // --- 2. Helper functions for Cookies ---
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function eraseCookie(name) {
            document.cookie = name + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }

        // --- 3. Page initialization (checks for previous cookies) ---
        function init() {
            // Check voting cookies
            const userVote = getCookie('userVote');
            if (userVote === 'like') {
                likes++;
                disableVoting();
            } else if (userVote === 'dislike') {
                dislikes++;
                disableVoting();
            }
            updateVoteUI();

            // Check comments cookies
            const savedComment = getCookie('userComment');
            if (savedComment) {
                showSavedComment(savedComment);
            }
        }

        function updateVoteUI() {
            likeCountSpan.innerText = likes;
            dislikeCountSpan.innerText = dislikes;
        }

        function disableVoting() {
            likeBtn.disabled = true;
            dislikeBtn.disabled = true;
        }

        function showSavedComment(comment) {
            commentInput.value = "";
            commentInput.disabled = true;
            submitBtn.disabled = true;
            userCommentText.innerText = comment;
            displayCommentArea.style.display = "block";
        }

        // --- 4. Voting buttons events (Like / Dislike) ---
        likeBtn.addEventListener('click', () => {
            if (!getCookie('userVote')) {
                setCookie('userVote', 'like', 30); // Save cookie for 30 days
                likes++;
                updateVoteUI();
                disableVoting();
            }
        });

        dislikeBtn.addEventListener('click', () => {
            if (!getCookie('userVote')) {
                setCookie('userVote', 'dislike', 30);
                dislikes++;
                updateVoteUI();
                disableVoting();
            }
        });

        // --- 5. Submit comment event ---
        submitBtn.addEventListener('click', () => {
            const text = commentInput.value.trim();
            if (text !== "") {
                setCookie('userComment', text, 30);
                showSavedComment(text);
            } else {
                alert("Please write a comment first!");
            }
        });

        // --- 6. Clear / Reset event ---
        clearBtn.addEventListener('click', () => {
            // Confirm user wants to reset
            if (confirm("Are you sure you want to reset your choices and comments?")) {
                // Erase cookies
                eraseCookie('userVote');
                eraseCookie('userComment');

                // Reset variables to default
                likes = 100;
                dislikes = 20;
                updateVoteUI();

                // Re-enable buttons and text input
                likeBtn.disabled = false;
                dislikeBtn.disabled = false;
                commentInput.disabled = false;
                submitBtn.disabled = false;

                // Hide comment display area
                commentInput.value = "";
                displayCommentArea.style.display = "none";

                // Confirmation message (optional requirement)
                alert("Your choices and comments have been cleared!");
            }
        });

        // Run initialization on page load
        init();

    </script>
</body>

</html>
